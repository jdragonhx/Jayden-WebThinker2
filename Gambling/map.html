<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeon Map</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    :root {
      --ink: #30251d;
      --paper: #d9c18e;
      --line: #5e4931;
      --accent: #8d3028;
      --shadow: #241d18;
    }

    body {
      min-height: 100vh;
      box-sizing: border-box;
      margin: 0;
      padding: 32px 20px;
      background: radial-gradient(circle at 50% 0%, #625e55 0, #302f2b 48%, #171816 100%);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
    }

    .map-shell { width: min(100%, 980px); margin: auto; }

    .map-header { text-align: center; margin-bottom: 28px; }
    .map-header h1 { margin: 0; color: #e3c987; font-size: clamp(2.2rem, 6vw, 4.5rem); letter-spacing: 0.08em; text-transform: uppercase; text-shadow: 3px 3px #171816; }
    .map-header p { margin: 10px 0 0; color: #d7d0bf; font-size: 1.1rem; }

    .map-board {
      position: relative;
      overflow: hidden;
      padding: clamp(28px, 6vw, 64px);
      border: 12px solid #3c3933;
      border-radius: 6px;
      background-color: var(--paper);
      background-image: linear-gradient(rgba(71, 52, 31, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(71, 52, 31, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      box-shadow: inset 0 0 0 3px #a98c5a, 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .map-board::before {
      content: '';
      position: absolute;
      inset: 14px;
      border: 2px solid rgba(94, 73, 49, 0.48);
      border-radius: 2px;
      pointer-events: none;
    }

    .map-path {
      position: absolute;
      top: 50%;
      left: 8%;
      right: 8%;
      height: 28px;
      transform: translateY(-50%);
      background: #b59a68;
      border-top: 3px solid var(--line);
      border-bottom: 3px solid var(--line);
      box-shadow: 0 0 0 8px var(--paper);
    }

    .destinations { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(28px, 8vw, 100px); }

    .destination {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 230px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      border: 4px solid var(--line);
      border-radius: 3px;
      background: rgba(235, 215, 166, 0.74);
      color: var(--ink);
      text-align: center;
      text-decoration: none;
      box-shadow: 8px 8px 0 rgba(57, 42, 27, 0.3);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .destination:hover { transform: translateY(-8px); background: #f0d99d; }
    .destination .icon { font-size: 3.8rem; line-height: 1; }
    .destination strong { color: var(--accent); font-size: 1.55rem; }
    .destination span:last-child { color: #594631; font-size: 1rem; }

    .destination::before, .destination::after { content: ''; position: absolute; width: 22px; height: 22px; border-color: var(--line); border-style: solid; }
    .destination::before { top: -4px; left: -4px; border-width: 4px 0 0 4px; }
    .destination::after { right: -4px; bottom: -4px; border-width: 0 4px 4px 0; }

    .map-footer { margin-top: 24px; text-align: center; }
    .map-footer a { color: #e3c987; }

    @media (max-width: 620px) {
      .destinations { grid-template-columns: 1fr; }
      .map-path { top: 25%; bottom: 25%; left: 50%; right: auto; width: 28px; height: auto; transform: translateX(-50%); }
    }
  </style>
</head>
<body>
  <main class="map-shell">
    <header class="map-header">
      <h1>Dungeon Map</h1>
      <p>Choose a room to enter</p>
    </header>

    <section class="map-board" aria-label="Dungeon map">
      <div class="map-path" aria-hidden="true"></div>
      <div class="destinations">
        <a class="destination" href="index.html">
          <span class="icon" aria-hidden="true">&#127922;</span>
          <strong>Lucky Dice Casino</strong>
          <span>Enter the gambling room</span>
        </a>
        <a class="destination" href="house.html">
          <span class="icon" aria-hidden="true">&#127968;</span>
          <strong>Your House</strong>
          <span>Teleport home and decorate</span>
        </a>
      </div>
    </section>

    <div class="map-footer"><a href="../index.html">Back to Home</a></div>
  </main>
</body>
</html>
